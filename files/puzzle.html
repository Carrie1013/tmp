<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birthday Quest · Puzzle</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────
   ink   #0B1622   board shadow
   blue  #1B4A82   the colour of the wall puzzle
   amber #E4B57D   invert(#1B4A82) — the negative state
   kraft #C39B6A   the back of a jigsaw piece
   mist  #D7DEE6   cold paper
   ───────────────────────────────────────────── */
:root{--ink:#0B1622;--blue:#1B4A82;--amber:#E4B57D;--kraft:#C39B6A;--mist:#D7DEE6;--gap:2px;
      --mask:invert(1) saturate(1.15)}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100%;background:var(--ink);color:var(--mist);
  font-family:"IBM Plex Mono",monospace;
  display:flex;flex-direction:column;align-items:center;
  padding:30px 14px 48px;gap:18px;-webkit-tap-highlight-color:transparent;
}
header{width:100%;max-width:560px;display:flex;align-items:baseline;justify-content:space-between}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--amber)}
.counter{font-size:11px;letter-spacing:.1em;color:#5C6B7C}

/* ── phase 1 · jigsaw ── */
#board{
  width:min(94vw,560px);aspect-ratio:4/3;display:grid;gap:var(--gap);
  background:#060D14;padding:var(--gap);border-radius:2px;
  box-shadow:0 24px 60px -20px #000, inset 0 0 0 1px #1A2836;
  touch-action:manipulation;transition:opacity .6s ease;
}
.tile{
  position:relative;border:0;padding:0;background-repeat:no-repeat;background-color:#0B1622;
  filter:var(--mask);
  transition:filter 1s ease,transform .14s ease,box-shadow .14s ease,opacity .5s ease;
  transform-style:preserve-3d;cursor:default;
}
.tile.active{cursor:pointer}
.tile.active:focus-visible{outline:2px solid var(--amber);outline-offset:1px;z-index:3}
.tile.sel{transform:scale(.82);box-shadow:0 0 0 2px var(--amber);z-index:2}
.tile.lock{box-shadow:inset 0 0 0 1px #E4B57D66}
.tile.done{filter:none}
.tile.pending{
  filter:none;background-image:radial-gradient(#00000018 1px,transparent 1px)!important;
  background-size:4px 4px!important;background-color:var(--kraft);opacity:.22;
}

/* ── phase 2 · nonogram ── */
#nono{display:none;width:min(94vw,560px);
  grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;gap:4px}
#nono.on{display:grid}
#corner{}
#ctop,#cleft{display:grid;gap:var(--gap);color:#6E8093;font-size:clamp(8px,1.9vw,11px);line-height:1.15}
#ctop{grid-template-columns:repeat(10,1fr)}
#ctop div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:3px}
#cleft{grid-template-rows:repeat(10,1fr)}
#cleft div{display:flex;align-items:center;justify-content:flex-end;gap:4px;padding-right:5px}
#ngrid{
  display:grid;grid-template-columns:repeat(10,1fr);gap:var(--gap);
  background:#060D14;padding:var(--gap);
  box-shadow:0 24px 60px -20px #000, inset 0 0 0 1px #1A2836;
}
.cell{
  aspect-ratio:1;border:0;padding:0;background:#12212F;cursor:pointer;
  transition:background .12s ease,transform .12s ease;position:relative;
}
.cell:nth-child(10n+6),.cell:nth-child(10n+1){box-shadow:inset 1px 0 0 #22323F}
.cell:focus-visible{outline:2px solid var(--amber);outline-offset:1px;z-index:2}
.cell.fill{background:var(--mist)}
.cell.mark::after{content:"";position:absolute;inset:34%;
  background:linear-gradient(45deg,transparent 44%,#3E5062 44% 56%,transparent 56%),
             linear-gradient(-45deg,transparent 44%,#3E5062 44% 56%,transparent 56%)}
#ngrid.solved .cell.fill{background:var(--amber)}
#ngrid.solved .cell.mark::after{opacity:0}
.cell.eye{
  color:var(--amber);font-family:"IBM Plex Mono",monospace;font-weight:600;
  font-size:clamp(11px,2.9vw,20px);letter-spacing:.02em;
  animation:surface .7s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes surface{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}

/* ── footer ── */
#bar{width:min(94vw,560px);display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:12px;letter-spacing:.08em;color:#5C6B7C}
#coord{color:var(--amber);letter-spacing:.24em}
#msg{width:min(94vw,560px);min-height:3.4em;font-size:14px;line-height:1.8;color:#8FA0B0;letter-spacing:.01em}
#msg strong{color:var(--mist);font-weight:600}
button.ghost{font:inherit;font-size:12px;letter-spacing:.14em;color:var(--mist);background:none;
  border:1px solid #22323F;padding:9px 16px;border-radius:2px;cursor:pointer;margin-top:14px}
button.ghost:hover{border-color:var(--amber);color:var(--amber)}
@media (prefers-reduced-motion:reduce){.tile,.cell{transition-duration:.01ms}
  .cell.eye{animation-duration:.01ms}}
</style>
<link rel="stylesheet" href="../birthday.css">
</head>
<body>

<header>
  <span class="eyebrow">BIRTHDAY QUEST · 01 / 05</span>
  <span class="counter" id="moves">MOVES 000</span>
</header>
<div id="board" role="group" aria-label="Jigsaw. Tap two pieces to swap them."></div>

<div id="nono">
  <div id="corner"></div>
  <div id="ctop"></div>
  <div id="cleft"></div>
  <div id="ngrid" role="group" aria-label="Nonogram grid"></div>
</div>

<div id="bar">
  <span id="prog">SECTOR 1 / 4 · 0 / 25 SET</span>
  <span id="coord"></span>
</div>

<p id="msg">Colours are inverted. Only the lit sector is live — pieces lock when they land right.</p>

<script>
/* ══════════════════════════════════════════════════
   IMAGE_URL → a photo of the wall puzzle (landscape, ~1600×1200)
   leave empty to use the built-in stand-in (blue / shelves / cats)
   ══════════════════════════════════════════════════ */
const CONFIG = {
  IMAGE_URL : "",
  MASK      : "negative",   // negative / shift / solar / ghost
  NEXT_URL  : "shoerack.html"
};

/* NEVER write invert(1) hue-rotate(180deg) — that is the dark-mode
   hue-preserving trick, so blue inverts straight back to blue. */
const MASKS = {
  negative : "invert(1) saturate(1.15)",
  shift    : "hue-rotate(140deg) saturate(1.5)",
  solar    : "invert(1) saturate(2.2) contrast(1.3)",
  ghost    : "invert(1) grayscale(1) contrast(1.4)"
};
document.documentElement.style.setProperty("--mask", MASKS[CONFIG.MASK] || MASKS.negative);

const S=10, Q=5, N=S*S;
const msg=document.getElementById("msg");

/* ───────── PHASE 2 · nonogram solution (derived clues, don't hand-count) ───── */
const SOLUTION = [
  "..X....X..",
  "..XX..XX..",
  "..XXXXXX..",
  ".XXXXXXXX.",
  ".XX.XX.XX.",
  ".XXXXXXXX.",
  ".XXX..XXX.",
  "..XXXXXX..",
  "..X....X..",
  "..X....X.."
].map(r=>r.split("").map(c=>c==="X"?1:0));

/* the two empty cells inside the face. They stay dark all the way
   through, then the coordinate surfaces in them at the very end. */
const EYES=[ {rc:[4,3], val:"07"}, {rc:[4,6], val:"23"} ];

/* ───────── PHASE 1 · jigsaw ───────── */
function fallback(){
  const pal=["#D9C7A3","#B8543F","#3E6B52","#8A6FA8","#D89A45","#5A7FA8","#C4655C","#7E9E6B"],books=[];
  for(let s=0;s<3;s++){let x=90;while(x<1080){
    const w=18+Math.round(Math.random()*22),h=90+Math.round(Math.random()*40);
    books.push(`<rect x="${x}" y="${300+s*210-h}" width="${w}" height="${h}" rx="2" fill="${pal[(x+s)%pal.length]}" opacity=".92"/>`);x+=w+5;}}
  const cat=(x,y,s,c)=>`<g transform="translate(${x},${y}) scale(${s})" fill="${c}"><ellipse rx="52" ry="30"/><circle cx="42" cy="-26" r="23"/><path d="M28,-42 L30,-64 L46,-48 Z"/><path d="M50,-48 L64,-62 L60,-40 Z"/><path d="M-50,-4 q-34,-6 -30,-40 q10,26 32,22 Z"/></g>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
   <defs><radialGradient id="v" cx=".5" cy=".45" r=".8"><stop offset=".55" stop-color="#2C5F9E" stop-opacity=".55"/><stop offset="1" stop-color="#0E2C52" stop-opacity=".85"/></radialGradient></defs>
   <rect width="1200" height="900" fill="#1B4A82"/><rect width="1200" height="900" fill="url(#v)"/>
   ${[0,1,2].map(s=>`<rect x="70" y="${300+s*210}" width="1030" height="12" fill="#8E6B45"/>`).join("")}
   ${books.join("")}
   ${cat(250,282,1,"#F0E6D2")}${cat(760,492,.85,"#2A2320")}${cat(430,702,1.1,"#C98A4B")}${cat(950,700,.75,"#E8E2D8")}
  </svg>`);
}
const IMG=CONFIG.IMAGE_URL||fallback();
const board=document.getElementById("board");
board.style.gridTemplateColumns=`repeat(${S},1fr)`;

const QUADS=[[0,0],[0,1],[1,0],[1,1]].map(([qr,qc])=>{
  const a=[];for(let r=qr*Q;r<qr*Q+Q;r++)for(let c=qc*Q;c<qc*Q+Q;c++)a.push(r*S+c);return a;});
let order=[...Array(N).keys()], sel=null, moves=0, qi=0;
let busy=false, phase=1;   // phase 1 jigsaw · 1.5 handoff · 2 nonogram

QUADS.forEach(slots=>{                 // shuffle inside each sector only
  let t=0;
  do{ const v=slots.map(s=>order[s]);
      for(let i=v.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[v[i],v[j]]=[v[j],v[i]];}
      slots.forEach((s,i)=>order[s]=v[i]); t++;
  } while(slots.filter(s=>order[s]===s).length>2 && t<40);
});

const tiles=[...Array(N)].map((_,i)=>{
  const t=document.createElement("button");
  t.className="tile pending"; t.tabIndex=-1;
  t.addEventListener("click",()=>tap(i));
  board.appendChild(t); return t;
});

function art(slot){
  const p=order[slot],c=p%S,r=(p/S)|0,t=tiles[slot];
  t.style.backgroundImage=`url("${IMG}")`;
  t.style.backgroundSize=`${S*100}% ${S*100}%`;
  t.style.backgroundPosition=`${c*100/(S-1)}% ${r*100/(S-1)}%`;
}
function openQuad(){
  QUADS[qi].forEach((s,i)=>{ art(s);
    tiles[s].classList.remove("pending"); tiles[s].classList.add("active");
    tiles[s].tabIndex=0; tiles[s].setAttribute("aria-label","Piece "+(i+1)); });
  paint();
}
function paint(){
  QUADS[qi].forEach(s=>tiles[s].classList.toggle("lock",order[s]===s));
  const ok=QUADS[qi].filter(s=>order[s]===s).length;
  document.getElementById("prog").textContent=`SECTOR ${qi+1} / 4 · ${ok} / ${Q*Q} SET`;
  document.getElementById("moves").textContent="MOVES "+String(moves).padStart(3,"0");
}
function tap(i){
  const t=tiles[i];
  if(busy||!t.classList.contains("active")||order[i]===i) return;
  if(sel===null){ sel=i; t.classList.add("sel"); return; }
  tiles[sel].classList.remove("sel");
  if(sel!==i){ [order[sel],order[i]]=[order[i],order[sel]]; moves++; QUADS[qi].forEach(art); }
  sel=null; paint();
  if(QUADS[qi].every(s=>order[s]===s)) finishQuad();
}
function finishQuad(){
  if(busy) return;                       // a sector transition is already running
  busy=true;
  QUADS[qi].forEach((s,i)=>{
    tiles[s].style.transitionDelay=(i*22)+"ms";
    tiles[s].classList.remove("active","lock"); tiles[s].classList.add("done");
    tiles[s].tabIndex=-1;
  });
  if(qi<QUADS.length-1){
    setTimeout(()=>{ qi++; openQuad(); busy=false; },1900);
    return;
  }

  phase=1.5;                             // all four sectors done
  setTimeout(()=>{
    msg.innerHTML="That was the easy half.";
    const b=document.createElement("button");
    b.className="ghost"; b.textContent="CONTINUE →";
    b.onclick=startNono; msg.appendChild(b);
    busy=false;
  },2000);
}

/* ───────── PHASE 2 ───────── */
function runs(line){ const out=[];let n=0;
  line.forEach(v=>{ if(v){n++;} else if(n){out.push(n);n=0;} }); if(n)out.push(n);
  return out.length?out:[0]; }

let cells=[], state=[], done=false;

function startNono(){
  if(phase===2) return;
  phase=2; busy=false;
  board.style.opacity=0;
  setTimeout(()=>{
    board.remove();
    document.getElementById("nono").classList.add("on");
    document.getElementById("prog").textContent="NONOGRAM · 10 × 10";
    msg.innerHTML="Numbers count unbroken runs of filled squares in that row or column. Tap once to fill, twice to rule out.";
    buildNono();
  },600);
}

function buildNono(){
  const ctop=document.getElementById("ctop"), cleft=document.getElementById("cleft"),
        grid=document.getElementById("ngrid");
  for(let c=0;c<S;c++){ const d=document.createElement("div");
    d.innerHTML=runs(SOLUTION.map(r=>r[c])).map(n=>`<span>${n}</span>`).join(""); ctop.appendChild(d); }
  for(let r=0;r<S;r++){ const d=document.createElement("div");
    d.innerHTML=runs(SOLUTION[r]).map(n=>`<span>${n}</span>`).join(""); cleft.appendChild(d); }

  state=[...Array(N)].map(()=>0);
  for(let i=0;i<N;i++){
    const b=document.createElement("button");
    b.className="cell"; b.setAttribute("aria-label",`row ${(i/S)|0}, column ${i%S}`);
    b.addEventListener("click",()=>cycle(i));
    grid.appendChild(b); cells.push(b);
  }
  count();
}

function cycle(i){
  if(done||cells[i].classList.contains("seed")) return;
  state[i]=(state[i]+1)%3;                     // 0 empty · 1 filled · 2 ruled out
  cells[i].classList.toggle("fill",state[i]===1);
  cells[i].classList.toggle("mark",state[i]===2);
  count();
  if(state.every((v,k)=>(v===1?1:0)===SOLUTION[(k/S)|0][k%S])) win();
}

function count(){
  const filled=state.filter(v=>v===1).length;
  const total=SOLUTION.flat().reduce((a,b)=>a+b,0);
  document.getElementById("prog").textContent=`NONOGRAM · ${filled} / ${total} FILLED`;
}

function win(){
  done=true;
  document.getElementById("ngrid").classList.add("solved");
  cells.forEach((c,i)=>c.style.transitionDelay=((i%S)*18+((i/S)|0)*18)+"ms");
  setTimeout(()=>{
    EYES.forEach(({rc,val},k)=>{
      const c=cells[rc[0]*S+rc[1]];
      c.classList.remove("mark"); c.classList.add("eye");
      c.textContent=val; c.style.animationDelay=(k*260)+"ms";
    });
    document.getElementById("coord").textContent=EYES.map(e=>e.val).join(" · ");
  },1100);
  setTimeout(()=>{
    msg.innerHTML=`You have walked past that wall a thousand times.<br>
      <strong>You have never seen the back of it.</strong>`;
    if(CONFIG.NEXT_URL){
      const a=document.createElement("a");
      a.href=CONFIG.NEXT_URL; a.className="ghost"; a.textContent="FOUND IT →";
      a.style.cssText="display:inline-block;text-decoration:none";
      msg.appendChild(a);
    }
  },1900);
}

/* ───────── dev skip ─────────
   Desktop: press S. Phone: tap the STATION label three times.
   Phase 1 solves the current sector. Phase 2 fills the nonogram.
   Delete this block before you send the link to her.          */
function skip(){
  if(busy) return;
  if(phase===1.5){ startNono(); return; }
  if(phase===2){
    if(done||!cells.length) return;
    for(let i=0;i<N;i++){
      const want=SOLUTION[(i/S)|0][i%S];
      state[i]=want?1:0;
      cells[i].classList.toggle("fill",!!want);
      cells[i].classList.remove("mark");
    }
    count(); win(); return;
  }
  if(sel!==null){ tiles[sel].classList.remove("sel"); sel=null; }
  QUADS[qi].forEach(s=>{ order[s]=s; art(s); });
  paint(); finishQuad();
}
addEventListener("keydown",e=>{ if(e.key==="s"||e.key==="S") skip(); });
let taps=0,tapT;
document.querySelector(".eyebrow").addEventListener("click",()=>{
  clearTimeout(tapT); if(++taps>=3){ taps=0; skip(); } tapT=setTimeout(()=>taps=0,600);
});

openQuad();
</script>
</body>
</html>
